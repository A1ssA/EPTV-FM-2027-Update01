  <style rel="stylesheet" crossorigin>* {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      padding: 0;
      background: #e2e8f0;
      font-family: "Calibri", "Segoe UI", Arial, sans-serif;
      color: #000000;
    }

    /* ==========================================================================
       2. INTERFACE SAAS ÉLÉGANTE & MODERNE (MASQUÉE À L'IMPRESSION)
       ========================================================================== */
    .saas-navbar {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #ffffff;
      padding: 10px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .saas-title-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      padding: 2px 7px;
      border-radius: 5px;
      line-height: 1.2;
    }

    .saas-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      margin: 0;
      color: #f8fafc;
      white-space: nowrap;
    }

    .db-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #cbd5e1;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .db-pill::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #94a3b8;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .db-pill.has-data {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.38);
      color: #6ee7b7;
    }

    .db-pill.has-data::before {
      background-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
    }

    .saas-toolbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn-group,
    .btn-group-export {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .btn-saas {
      border: 1px solid transparent;
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 12.5px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      color: #ffffff;
      user-select: none;
      line-height: 1.2;
      box-sizing: border-box;
    }

    .btn-saas:hover {
      transform: translateY(-1px);
    }

    .btn-saas:active {
      transform: translateY(0);
      filter: brightness(0.95);
    }

    .btn-saas:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    .btn-icon {
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .btn-saas:hover .btn-icon {
      transform: scale(1.08);
    }

    /* 1. Importer Base Excel */
    .btn-import {
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
      border-color: rgba(59, 130, 246, 0.4);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }
    .btn-import:hover {
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.38);
    }

    /* 2. Édition lignes tableau */
    .btn-add {
      background: rgba(30, 41, 59, 0.85);
      border-color: rgba(71, 85, 105, 0.7);
      color: #e2e8f0;
    }
    .btn-add:hover {
      background: #334155;
      border-color: #64748b;
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    .btn-delete {
      background: rgba(220, 38, 38, 0.16);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .btn-delete:hover {
      background: #dc2626;
      border-color: #dc2626;
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(220, 38, 38, 0.35);
    }

    /* 3. Réinitialiser */
    .btn-clear {
      background: transparent;
      border-color: rgba(100, 116, 139, 0.45);
      color: #cbd5e1;
    }
    .btn-clear:hover {
      background: rgba(51, 65, 85, 0.5);
      border-color: #94a3b8;
      color: #ffffff;
    }

    /* 4. Imprimer */
    .btn-print {
      background: rgba(15, 118, 110, 0.22);
      border-color: rgba(20, 184, 166, 0.45);
      color: #5eead4;
    }
    .btn-print:hover {
      background: #0f766e;
      border-color: #0d9488;
      color: #ffffff;
      box-shadow: 0 3px 12px rgba(13, 148, 136, 0.32);
    }

    /* 5. Exporter en PDF */
    .btn-pdf {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border-color: rgba(16, 185, 129, 0.5);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3);
    }
    .btn-pdf:hover {
      background: linear-gradient(135deg, #047857 0%, #059669 100%);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.45);
    }

    /* ==========================================================================
       3. CONTENEUR FEUILLE A4
       ========================================================================== */
    .a4-workspace {
      padding: 28px 16px 48px 16px;
      display: flex;
      justify-content: center;
    }

    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      padding: 10mm 8mm 8mm 8mm;
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.15), 0 2px 6px rgba(15, 23, 42, 0.08);
      border-radius: 2px;
      position: relative;
    }

    /* Champs de saisie et menus déroulants */
    .excel-input, .excel-select {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      font-family: "Calibri", Arial, sans-serif;
      font-size: inherit;
      font-weight: inherit;
      color: #000000;
      text-align: inherit;
      padding: 0;
      margin: 0;
      outline: none;
    }

    .excel-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
      font-style: italic;
    }

    .excel-input:focus, .excel-select:focus {
      background-color: #f0f9ff;
      box-shadow: inset 0 0 0 1px #0284c7;
    }

    /* ==========================================================================
       COMBOBOX SUR MESURE POUR NOM & PRENOM (FILTRAGE LETTRE PAR LETTRE + FLÈCHE)
       ========================================================================== */
    td.cell-nom {
      padding: 0 !important;
      font-weight: 700;
      text-align: left;
      overflow: visible !important; /* Permet d'afficher la liste filtrée par-dessus les lignes */
      position: relative;
    }

    .nom-combobox {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .nom-combobox input.inp-nom {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      font-family: "Calibri", Arial, sans-serif;
      font-size: 8.4pt;
      font-weight: 700;
      color: #000000;
      padding-left: 4px;
      padding-right: 16px;
      outline: none;
      text-transform: uppercase;
    }

    .nom-combobox .combo-arrow {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8.5pt;
      color: #64748b;
      cursor: pointer;
      user-select: none;
    }

    .nom-combobox .combo-arrow:hover {
      color: #0f172a;
      background-color: #e2e8f0;
    }

    /* Menu déroulant flottant filtré lettre par lettre */
    .nom-dropdown-list {
      display: none;
      position: absolute;
      top: 100%;
      left: -1px;
      width: 280px;
      max-height: 210px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #0284c7;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.22);
      z-index: 9999;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nom-dropdown-list.open {
      display: block;
    }

    .nom-dropdown-item {
      padding: 5px 8px;
      font-family: "Calibri", Arial, sans-serif;
      font-size: 9pt;
      font-weight: 600;
      color: #0f172a;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .nom-dropdown-item:hover,
    .nom-dropdown-item.highlighted {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .nom-dropdown-item .match-chars {
      color: #2563eb;
      text-decoration: underline;
      font-weight: 800;
    }

    .nom-dropdown-item .meta-agent {
      font-size: 7.5pt;
      font-weight: 400;
      color: #64748b;
      white-space: nowrap;
    }

    /* Sélecteur de Date avec Calendrier natif superposé + Affichage JJ/MM/AAAA */
    .date-picker-cell {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .date-display-text {
      font-family: "Calibri", Arial, sans-serif;
      font-size: 9.5pt;
      font-weight: 700;
      color: #000000;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .date-display-text .cal-arrow {
      font-size: 8pt;
      color: #64748b;
    }

    .date-native-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
      margin: 0;
      padding: 0;
    }

    /* Sélecteur d'heure (12:00 / 15:00 / 20:00) */
    .heure-select-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heure-select-wrapper select {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      font-family: "Calibri", Arial, sans-serif;
      font-size: 9.5pt;
      font-weight: 400;
      text-align: center;
      text-align-last: center;
      color: #000000;
      cursor: pointer;
      outline: none;
    }
    /* Sélection de ligne à l'écran */
    tr.active-row td {
      background-color: #f0f9ff !important;
    }
    /* ==========================================================================
       4. STRUCTURE & BORDURES EXACTES DU MODÈLE EXCEL
       ========================================================================== */
    table.banner-direction-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background-color: #EBEBEB;
      border: 1pt solid #000000;
      height: 7.5mm;
      margin-bottom: 3.5mm;
    }

    table.banner-direction-table td {
      height: 7.5mm;
      padding: 0 4px;
      vertical-align: middle;
      font-family: "Calibri", Arial, sans-serif;
      font-weight: 700;
      font-size: 11pt;
    }

    td.banner-col-dst {
      width: 13%;
      text-align: center;
      border-right: 1pt solid #000000;
      letter-spacing: 0.5px;
    }

    td.banner-col-sd {
      width: 87%;
      text-align: center;
      padding: 0 4px;
    }

    .banner-select {
      width: 100%;
      height: 100%;
      font-family: "Calibri", Arial, sans-serif;
      font-weight: 700;
      font-size: 10pt;
      text-align: center;
      text-align-last: center;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      color: #000000;
      letter-spacing: 0.2px;
    }

    /* Grille de 11 colonnes commune à l'entête et au tableau */
    col.c-nom        { width: 22.0%; }
    col.c-fonction   { width: 17.5%; }
    col.c-categorie  { width: 7.8%;  }
    col.c-njours     { width: 5.2%;  }
    col.c-nrepas     { width: 5.2%;  }
    col.c-pctjour    { width: 8.0%;  }
    col.c-repas      { width: 4.8%;  }
    col.c-pp         { width: 4.5%;  }
    col.c-net        { width: 6.7%;  }
    col.c-mat        { width: 5.8%;  }
    col.c-emargement { width: 12.5%; }

    table.cartouche-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-bottom: 0;
    }

    table.cartouche-table td {
      font-family: "Calibri", Arial, sans-serif;
      font-size: 9.5pt;
      font-weight: 700;
      height: 5.4mm;
      padding: 0 4px;
      vertical-align: middle;
    }

    .b-cell   { border: 0.75pt solid #000000; }
    .bg-head  { background-color: #EBEBEB; }
    .t-left   { text-align: left; }
    .t-center { text-align: center; }
    .t-right  { text-align: right; }

    /* Tableau Principal */
    table.mission-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1pt solid #000000;
    }

    table.mission-table thead th {
      background-color: #EBEBEB;
      border: 0.75pt solid #000000;
      font-family: "Calibri", Arial, sans-serif;
      font-size: 8.2pt;
      font-weight: 700;
      text-align: center;
      vertical-align: middle;
      height: 6.4mm;
      padding: 0 1px;
      white-space: nowrap;
      overflow: hidden;
      letter-spacing: -0.1px;
    }

    /* Bordures extérieures renforcées (nom&prenom à gauche, émargement à droite) */
    table.mission-table thead th:first-child,
    table.mission-table tbody td:first-child {
      border-left: 1pt solid #000000;
    }

    table.mission-table thead th:last-child,
    table.mission-table tbody td:last-child {
      border-right: 1pt solid #000000;
    }

    table.mission-table tbody tr {
      height: 7.6mm;
      background-color: #ffffff;
    }

    table.mission-table tbody td {
      border: 0.75pt solid #000000;
      background-color: #ffffff;
      font-family: "Calibri", Arial, sans-serif;
      font-size: 8.8pt;
      vertical-align: middle;
      padding: 0 3px;
      white-space: nowrap;
      overflow: hidden;
    }

    td.cell-poste {
      font-weight: 400;
      text-align: center;
      font-size: 8.4pt;
    }

    td.cell-num {
      font-weight: 400;
      text-align: center;
      font-size: 8.8pt;
    }

    /* Colonne NET en BLANC */
    td.cell-net {
      background-color: #ffffff !important;
      font-weight: 700;
      text-align: center;
      font-size: 8.8pt;
    }

    td.cell-mat {
      font-weight: 400;
      text-align: center;
      font-size: 8.5pt;
    }

    /* Ligne TOTAL & Somme Globale agrandie à 300% */
    tr.total-row td {
      height: 11mm;
      font-family: "Calibri", Arial, sans-serif;
      padding: 0;
      vertical-align: middle;
    }

    td.total-empty {
      border: none;
      background: transparent;
    }

    td.total-title {
      background-color: #DCDCDC;
      border: 1pt solid #000000;
      text-align: center;
      font-size: 13pt;
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    td.total-amount {
      background-color: #EBEBEB;
      border: 1.25pt solid #000000;
      text-align: center;
      vertical-align: middle;
      width: 100%;
      font-size: 17pt; /* Case agrandie 300% avec police imposante et très lisible */
      font-weight: 900;
      letter-spacing: 0.6px;
      white-space: nowrap;
      padding: 0 6px;
    }

    /* Pied de page */
    .footer-section {
      margin-top: 4mm;
      font-family: "Calibri", Arial, sans-serif;
    }

    .arrete-label {
      font-size: 12pt;
      font-weight: 700;
      margin-bottom: 1.5mm;
    }

    .arrete-words {
      font-size: 11.5pt;
      font-weight: 700;
      font-style: italic;
      margin-bottom: 4mm;
      min-height: 5mm;
    }

    .signature-ordonnateur {
      text-align: right;
      padding-right: 22mm;
      font-size: 11.5pt;
      font-weight: 700;
      text-decoration: underline;
    }

    /* ==========================================================================
       1. CONFIGURATION STRICTE PAGE A4 & IMPRESSION
       ========================================================================== */
    @page {
      size: A4 portrait;
      margin: 8mm 8mm 8mm 8mm;
    }



    /* Règles strictes d'impression : 0 flèche, 0 placeholder, fidélité 100% Excel */
    @media print {
      body { background: #ffffff; }
      .saas-navbar { display: none !important; }
      .a4-workspace { padding: 0; }
      .a4-sheet {
        width: 100%;
        min-height: auto;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
      .excel-input::placeholder {
        color: transparent !important;
      }
      .excel-input, .excel-select, .banner-select, .heure-select-wrapper select, .nom-combobox input.inp-nom {
        -webkit-appearance: none !important;
        -moz-appearance: none !important;
        appearance: none !important;
        background: transparent !important;
        box-shadow: none !important;
        padding-right: 2px !important;
        border: none !important;
      }
      .nom-combobox .combo-arrow,
      .nom-dropdown-list,
      .date-display-text .cal-arrow {
        display: none !important;
      }
      input::-webkit-calendar-picker-indicator {
        display: none !important;
        opacity: 0 !important;
      }

      /* Intégrité stricte des bordures sur tout le tableau et toutes les colonnes */
      table.mission-table,
      table.cartouche-table,
      table.banner-direction-table {
        border-collapse: collapse !important;
        border: 1pt solid #000000 !important;
      }
      table.mission-table thead th,
      table.mission-table tbody td {
        border: 0.75pt solid #000000 !important;
      }
      table.mission-table thead th:first-child,
      table.mission-table tbody td:first-child {
        border-left: 1.2pt solid #000000 !important;
      }
      table.mission-table thead th:last-child,
      table.mission-table tbody td:last-child {
        border-right: 1.2pt solid #000000 !important;
      }
      .cell-emargement {
        border-right: 1.2pt solid #000000 !important;
      }

      /* Case TOTAL agrandie 300% à l'impression */
      tr.total-row td {
        height: 11mm !important;
      }
      td.total-title {
        font-size: 13pt !important;
        font-weight: 800 !important;
        border: 1pt solid #000000 !important;
      }
      td.total-amount {
        font-size: 17pt !important;
        font-weight: 900 !important;
        border: 1.25pt solid #000000 !important;
      }
    }

    @media print {
      tr.active-row td {
        background-color: #ffffff !important;
      }
    }</style>
</head>

  <!-- 2. ESPACE DE TRAVAIL & FEUILLE A4 IMPRIMABLE -->
  <main class="a4-workspace">
    <div class="a4-sheet">

      <!-- BANDEAU SOUS-DIRECTION EN 2 COLONNES -->
      <table class="banner-direction-table">
        <tbody>
          <tr>
            <td class="banner-col-dst">DST</td>
            <td class="banner-col-sd">
              <select id="selSousDirection" class="banner-select">
                <option value="SOUS DIRECTION DES MOYENS DE PRODUCTION VIDEO MOBILE" selected>SOUS DIRECTION DES MOYENS DE PRODUCTION VIDEO MOBILE</option>
                <option value="SOUS DIRECTION DES MOYENS DE PRODUCTION VIDEO FIXE">SOUS DIRECTION DES MOYENS DE PRODUCTION VIDEO FIXE</option>
                <option value="SOUS DIRECTION DE DIFFUSION">SOUS DIRECTION DE DIFFUSION</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- CARTOUCHE D'EN-TÊTE DE MISSION -->
      <table class="cartouche-table">
        <colgroup>
          <col class="c-nom">
          <col class="c-fonction">
          <col class="c-categorie">
          <col class="c-njours">
          <col class="c-nrepas">
          <col class="c-pctjour">
          <col class="c-repas">
          <col class="c-pp">
          <col class="c-net">
          <col class="c-mat">
          <col class="c-emargement">
        </colgroup>
        <tbody>
          <!-- Ligne 1 : DESTINATION (vide par défaut) & FRAIS DE MISSION -->
          <tr>
            <td class="b-cell bg-head t-left">DESTINATION:</td>
            <td class="b-cell t-center" colspan="6">
              <input type="text" id="inpDestination" class="excel-input t-center" list="dlDestinations" value="" placeholder="Saisir ou choisir la destination..." />
            </td>
            <td></td>
            <td class="b-cell bg-head t-center" colspan="2" style="font-size:8pt;">FRAIS DE MISSION:</td>
            <td class="b-cell t-center">
              <select id="cellAI1_Zone" class="excel-select t-center">
                <option value="NORD" selected>NORD</option>
                <option value="SUD">SUD</option>
              </select>
            </td>
          </tr>

          <!-- Ligne 2 : EVENEMENT (vide par défaut) & TAUX (100% / 40%) -->
          <tr>
            <td class="b-cell bg-head t-left">EVENEMENT:</td>
            <td class="b-cell t-center" colspan="6">
              <input type="text" id="inpEvenement" class="excel-input t-center" value="" placeholder="Saisir l'événement..." />
            </td>
            <td></td>
            <td class="b-cell t-center" colspan="3" rowspan="2" style="font-size:13pt; font-weight:700;">
              <select id="cellAK1_Taux" class="excel-select t-center" style="font-size:13pt; font-weight:700;">
                <option value="1" selected>100%</option>
                <option value="0.4">40%</option>
                <option value="0.25">25%</option>
              </select>
            </td>
          </tr>

          <!-- Ligne 3 : DATE DU (Calendrier) AU (Calendrier >= Départ) -->
          <tr>
            <td class="b-cell bg-head t-left">DATE:</td>
            <td class="b-cell t-center">DU</td>
            <td class="b-cell t-center" colspan="2">
              <div class="date-picker-cell">
                <span class="date-display-text" id="labelDateDebut">
                  <span class="val-date"></span>
                  <span class="cal-arrow">▾</span>
                </span>
                <input type="date" id="dateDebutPicker" class="date-native-input" />
              </div>
            </td>
            <td class="b-cell t-center">AU</td>
            <td class="b-cell t-center" colspan="2">
              <div class="date-picker-cell">
                <span class="date-display-text" id="labelDateFin">
                  <span class="val-date"></span>
                  <span class="cal-arrow">▾</span>
                </span>
                <input type="date" id="dateFinPicker" class="date-native-input" />
              </div>
            </td>
            <td></td>
          </tr>

          <!-- Ligne 4 : HEURE DE RETOUR (3 horaires prédéfinis : 12:00, 15:00, 20:00) -->
          <tr style="height: 5.2mm;">
            <td colspan="5"></td>
            <td class="b-cell t-center" colspan="2" style="padding:0;">
              <div class="heure-select-wrapper">
                <select id="cellN4_HeureFin">
                  <option value="12:00" selected>12:00</option>
                  <option value="15:00">15:00</option>
                  <option value="20:00">20:00</option>
                </select>
              </div>
            </td>
            <td colspan="4"></td>
          </tr>
        </tbody>
      </table>

      <!-- TABLEAU PRINCIPAL DES MISSIONNAIRES (100% Vierge à l'origine) -->
      <table class="mission-table" id="tableMission">
        <colgroup>
          <col class="c-nom">
          <col class="c-fonction">
          <col class="c-categorie">
          <col class="c-njours">
          <col class="c-nrepas">
          <col class="c-pctjour">
          <col class="c-repas">
          <col class="c-pp">
          <col class="c-net">
          <col class="c-mat">
          <col class="c-emargement">
        </colgroup>
        <thead>
          <tr>
            <th>NOM &amp; PRENOM</th>
            <th>FONCTION</th>
            <th>CATEGORIE</th>
            <th>N JOURS</th>
            <th>N REPAS</th>
            <th>% DU JOUR</th>
            <th>REPAS</th>
            <th>PP</th>
            <th>NET</th>
            <th>MAT</th>
            <th>EMARGEMENT</th>
          </tr>
        </thead>
        <tbody id="tbodyMission"></tbody>
        <tfoot>
          <tr class="total-row">
            <td colspan="5" class="total-empty"></td>
            <td colspan="2" class="total-title">TOTAL</td>
            <!-- Somme globale agrandie (300%) sur colonnes PP + NET + MAT + EMARGEMENT -->
            <td colspan="4" class="total-amount" id="cellP41_Total">0 DA</td>
          </tr>
        </tfoot>
      </table>

      <!-- PIED DE PAGE -->
      <div class="footer-section">
        <div class="arrete-label">Arrêter le présent état à la somme de :</div>
        <div class="arrete-words" id="cellA44_Lettres">Zéro Dinars</div>
        <div class="signature-ordonnateur">L'Ordonnateur</div>
      </div>

    </div>
  </main>

</body>
</html>
